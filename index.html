<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Эволюция Нарзана (Beta)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at top, #1b1c3e 0%, #0a0b1a 100%); color: #fff; display: flex; justify-content: center; height: 100vh; overflow: hidden; touch-action: manipulation; }
  .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; padding: 10px 15px 20px; position: relative; }
  
  /* --- ШАПКА --- */
  header { text-align: center; position: relative; padding: 0 45px; z-index: 10; }
  .menu-btn { position: absolute; top: 0; right: 0; background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 18px; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; z-index: 20; }
  .prestige-btn { position: absolute; top: 0; left: 0; background: rgba(245,158,11,0.2); border: 1px solid #fbbf24; color: #fbbf24; width: 40px; height: 40px; border-radius: 10px; display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 20; }
  
  /* --- ВЫПАДАЮЩЕЕ МЕНЮ --- */
  .dropdown {
    position: absolute; top: 45px; right: 0; width: 280px; 
    background: rgba(20, 20, 40, 0.95); border: 2px solid #6a4cff; border-radius: 12px;
    padding: 10px; display: none; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    z-index: 50; backdrop-filter: blur(5px);
  }
  .dropdown.show { display: flex; }
  
  /* Вкладки */
  .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .tab { flex: 1 1 30%; background: rgba(106, 76, 255, 0.2); color: #fff; border: 1px solid transparent; padding: 6px 2px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .tab.active { background: #6a4cff; border-color: #8a6cff; }
  
  /* Контент вкладок */
  .tab-content { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; padding-right: 5px; }
  .tab-content::-webkit-scrollbar { width: 4px; }
  .tab-content::-webkit-scrollbar-thumb { background: #6a4cff; border-radius: 4px; }
  
  .pet-card { display: flex; align-items: center; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; gap: 8px; border: 1px solid transparent; }
  .pet-card.on { border-color: #5eead4; background: rgba(94, 234, 212, 0.1); }
  .pet-btn { background: #333; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }
  .pet-btn:active { transform: scale(0.95); }

  /* Донат */
  .donate-card { background: rgba(255,255,255,0.05); border: 1px solid #6a4cff; padding: 10px; border-radius: 10px; display: flex; flex-direction: column; gap: 5px; }
  .donate-card h3 { font-size: 14px; color: #fbbf24; }
  .donate-card p { font-size: 11px; color: #8a9bbd; }
  .donate-btn { background: #fbbf24; color: #000; font-weight: bold; border: none; padding: 8px; border-radius: 8px; cursor: pointer; margin-top: 5px; }

  /* --- ИГРА --- */
  .aura-display { font-size: clamp(18px, 7vw, 28px); font-weight: 800; display: flex; justify-content: center; gap: 8px; pointer-events: none; }
  .crystal-display { font-size: 14px; color: #60a5fa; font-weight: bold; pointer-events: none; }
  .stage-name { font-size: 13px; color: #8a9bbd; margin-top: 5px; pointer-events: none; }
  .income-text { font-size: 12px; color: #5eead4; font-weight: 600; pointer-events: none; }

  .click-zone { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; cursor: pointer; min-height: 120px; z-index: 1; touch-action: manipulation; }
  #charEmoji { font-size: 80px; filter: drop-shadow(0 0 20px rgba(110,200,255,0.5)); pointer-events: none; }

  .final-box { display: none; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; border: 1px solid rgba(255,200,60,0.3); margin-bottom: 5px; text-align: center; pointer-events: none; }
  .progress-bar { height: 6px; background: rgba(0,0,0,0.5); border-radius: 3px; overflow: hidden; margin-top: 5px; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #fbbf24, #ef4444); transition: width 0.3s; }

  .codes { display: flex; gap: 5px; margin-bottom: 8px; z-index: 10; }
  .codes input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px; border-radius: 10px; outline: none; }
  .codes button { background: #6a4cff; border: none; color: #fff; padding: 0 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }

  .buttons { display: flex; flex-direction: column; gap: 8px; z-index: 10; }
  .btn { width: 100%; border-radius: 12px; padding: 12px; border: none; background: linear-gradient(135deg, #6a4cff, #8a6cff); color: #fff; font-weight: bold; font-size: 15px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .btn:active { transform: scale(0.97); }
  .btn-sub { font-size: 11px; font-weight: normal; opacity: 0.8; margin-top: 2px; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; border: 1px solid #6a4cff; }
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="prestige-btn" id="btnPrestige" onclick="doPrestige()">🔄</button>
    
    <div class="dropdown" id="dropdownMenu">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('ach', this)">Ачивки</button>
        <button class="tab" onclick="switchTab('pets', this)">Питомцы</button>
        <button class="tab" onclick="switchTab('talents', this)">Таланты</button>
        <button class="tab" onclick="switchTab('shop', this)">💎 Донат</button>
      </div>
      <div class="tab-content" id="tabContent"></div>
    </div>

    <button class="menu-btn" id="menuBtn" onclick="toggleMenu()">☰</button>
    
    <div class="aura-display"><span>💧</span> <span id="auraVal">0</span></div>
    <div class="crystal-display">💎 <span id="crystalVal">0</span> | 📦 <span id="caseVal">0</span></div>
    <div class="stage-name" id="stageName">Мыло «Аура»</div>
    <div class="income-text" id="incomeVal">+0 капелек / сек</div>
  </header>

  <div class="click-zone" id="clickZone" onclick="doClick(event)">
    <span id="charEmoji">🧼</span>
  </div>

  <div class="final-box" id="finalBox">
    <div style="font-size:12px; color:#ffd66b; font-weight:bold;" id="finalText">До след. формы: 0/100</div>
    <div class="progress-bar"><div class="progress-fill" id="finalFill"></div></div>
  </div>

  <div class="codes">
    <input id="codeInput" placeholder="Бонус-код...">
    <button onclick="useCode()">Ввести</button>
  </div>

  <div class="buttons">
    <button class="btn" id="btnClick" onclick="buyClick()">
      <div>Улучшить клик</div>
      <div class="btn-sub" id="costClick">10</div>
    </button>
    <button class="btn" id="btnAura" onclick="buyAura()">
      <div>Улучшить ауру</div>
      <div class="btn-sub" id="costAura">15</div>
    </button>
    <button class="btn" id="btnBooster" onclick="buyBooster()">
      <div>Бустер x2 (30с)</div>
      <div class="btn-sub" id="costBooster">150</div>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CFG = {
  emoji: ['🧼','🧴','🧼','💧','💧','💧','🪥','🪥','🪥','🥤','🥤','🥤','🥤','🥤','🥤','🥤','🥤','🥤','🥤','🍺','🍷','🍾','🥃','🍾','🌌'],
  names: ['Мыло','Жидкое мыло','Твёрдое мыло','Бутылка воды','Мин. вода','Газ. вода','Чёрная щётка','Эл. щётка','Ультразвук','Нарзан','Квас','Сок','Морс','Компот','Лимонад','Чай','Кофе','Какао','Энергетик','Пиво','Вино','Шампанское','Коньяк','Чекушка','Космос'],
  req: [0, 5, 10, 15, 20, 30, 40, 50, 60, 75, 90, 105, 120, 135, 150, 165, 180, 195, 210, 225, 240, 260, 280, 300, 350]
};

// Добавлены новые эксклюзивные питомцы за донат
const PETS = [
  { name: 'Мышь', emoji: '🐁', cost: 500000, type: 'click', val: 1.2 },
  { name: 'Енот', emoji: '🦝', cost: 1500000, type: 'income', val: 1.2 },
  { name: 'Попугай', emoji: '🦜', cost: 3000000, type: 'click', val: 1.3 },
  { name: 'Заяц', emoji: '🐇', cost: 6000000, type: 'income', val: 1.3 },
  { name: 'Волк', emoji: '🐺', cost: 10000000, type: 'click', val: 1.5 },
  { name: 'Собака', emoji: '🐕', cost: 30000000, type: 'income', val: 1.5 },
  { name: 'Кошка', emoji: '🐈', cost: 50000000, type: 'global', val: 1.5 },
  { name: 'Крокодил', emoji: '🐊', cost: 80000000, type: 'click', val: 1.8 },
  { name: 'Змея', emoji: '🐍', cost: 120000000, type: 'income', val: 1.8 },
  { name: 'Рыба', emoji: '🐟', cost: 180000000, type: 'global', val: 1.8 },
  { name: 'Кеша', emoji: '🦜', cost: 400000000, type: 'click', val: 3.0 },
  { name: 'Перри', emoji: '🦆', cost: 600000000, type: 'income', val: 3.0 },
  { name: 'Лев', emoji: '🦁', cost: 900000000, type: 'global', val: 2.5 },
  { name: 'Дракон', emoji: '🐉', cost: 1500000000, type: 'global', val: 3.0 },
  { name: 'Милка', emoji: '🐱', cost: 3000000000, type: 'global', val: 5.0 },
  // Эксклюзивные донатные питомцы
  { name: 'Квантовый Кот', emoji: '🐈‍⬛', cost: 999999999999, type: 'global', val: 10.0 },
  { name: 'Алмазный Ёж', emoji: '🦔', cost: 999999999999, type: 'click', val: 8.0 },
  { name: 'Кибер-Кит', emoji: '🐋', cost: 999999999999, type: 'income', val: 8.0 }
];

let state = { 
  aura: 0, clickLvl: 1, auraLvl: 0, stage: 0, 
  crystals: 0, cases: 0, boosterLvl: 0, boosterEnd: 0, 
  pets: [], active: [], talents: { c: 0, i: 0 } 
};

function save() { localStorage.setItem('narzan_beta', JSON.stringify(state)); }
function load() { const s = localStorage.getItem('narzan_beta'); if (s) Object.assign(state, JSON.parse(s)); }
function fmt(n) { return Math.floor(n).toLocaleString('ru-RU'); }
function short(n) { return n >= 1e9 ? (n/1e9).toFixed(1)+'млрд' : n >= 1e6 ? (n/1e6).toFixed(1)+'млн' : n >= 1e3 ? (n/1e3).toFixed(1)+'к' : n; }

function toast(txt) {
  const t = document.getElementById('toast');
  t.textContent = txt;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 2500);
}

function toggleMenu() {
  document.getElementById('dropdownMenu').classList.toggle('show');
}

document.addEventListener('click', function(event) {
  const menu = document.getElementById('dropdownMenu');
  const btn = document.getElementById('menuBtn');
  if (!menu.contains(event.target) && !btn.contains(event.target)) {
    menu.classList.remove('show');
  }
});

// НОВАЯ ЛОГИКА ПИТОМЦЕВ: 5 питомцев выгоднее, чем 1
function getPetMult(type) {
  let res = 1;
  let activeCount = state.active.length;
  // Бонус синергии: +15% к силе питомцев за каждого дополнительного питомца в команде
  let synergyBonus = 1 + (activeCount > 1 ? (activeCount - 1) * 0.15 : 0); 

  state.active.forEach(id => {
    const p = PETS[id];
    if (p && (p.type === type || p.type === 'global')) {
      res += (p.val - 1) * synergyBonus; 
    }
  });
  return res;
}

function getClickPower() { return state.clickLvl * (Date.now() < state.boosterEnd ? 2 : 1) * getPetMult('click'); }
function getIncome() { return state.auraLvl * (Date.now() < state.boosterEnd ? 2 : 1) * getPetMult('income'); }

function getClickCost() { return state.clickLvl < 5 ? Math.floor(10 * Math.pow(1.05, state.clickLvl - 1)) : Math.floor(1000 * Math.pow(1.05, state.clickLvl - 5)); }
function getAuraCost() { return state.auraLvl < 5 ? Math.floor(15 * Math.pow(1.05, state.auraLvl)) : Math.floor(1000 * Math.pow(1.05, state.auraLvl - 5)); }
function getBoosterCost() { return state.boosterLvl < 5 ? Math.floor(150 * Math.pow(1.08, state.boosterLvl)) : Math.floor(1000 * Math.pow(1.08, state.boosterLvl - 5)); }

function checkStage() {
  let ns = 0;
  for (let i = 0; i < CFG.req.length; i++) { if (state.auraLvl >= CFG.req[i]) ns = i; }
  if (ns > state.stage) {
    state.stage = ns;
    const rewards = [300,500,800,1200,2000,3500,6000,10000,18000,35000,100000,150000,250000,400000,700000,1200000,2000000,3500000,6000000,10000000,18000000,35000000,60000000,100000000,200000000];
    const reward = rewards[ns] || 500000000;
    state.aura += reward;
    toast('Новая форма! +' + fmt(reward) + ' капелек');
    document.getElementById('charEmoji').textContent = CFG.emoji[ns];
    document.getElementById('stageName').textContent = CFG.names[ns];
  }
}

function updateUI() {
  document.getElementById('auraVal').textContent = fmt(state.aura);
  document.getElementById('crystalVal').textContent = fmt(state.crystals);
  document.getElementById('caseVal').textContent = fmt(state.cases);
  document.getElementById('incomeVal').textContent = '+' + fmt(getIncome()) + ' капелек / сек';
  document.getElementById('costClick').textContent = short(getClickCost());
  document.getElementById('costAura').textContent = short(getAuraCost()) + ' (есть: ' + state.auraLvl + ')';
  document.getElementById('costBooster').textContent = Date.now() < state.boosterEnd ? 'Активен!' : short(getBoosterCost());

  if (state.stage < 24) {
    document.getElementById('finalBox').style.display = 'block';
    const target = CFG.req[state.stage + 1];
    const pct = Math.min(100, (state.auraLvl / target) * 100);
    document.getElementById('finalFill').style.width = pct + '%';
    document.getElementById('finalText').textContent = `До след. формы: ${state.auraLvl}/${target}`;
  } else {
    document.getElementById('finalBox').style.display = 'none';
  }
  if (state.stage >= 3) document.getElementById('btnPrestige').style.display = 'flex';
}

function buyClick() { const c = getClickCost(); if (state.aura >= c) { state.aura -= c; state.clickLvl++; updateUI(); save(); } }
function buyAura() { const c = getAuraCost(); if (state.aura >= c) { state.aura -= c; state.auraLvl++; checkStage(); updateUI(); save(); } }
function buyBooster() { const c = getBoosterCost(); if (state.aura >= c && Date.now() >= state.boosterEnd) { state.aura -= c; state.boosterLvl++; state.boosterEnd = Date.now() + 30000; updateUI(); save(); } }

function doPrestige() {
  if (confirm('Сбросить прогресс ради бонуса?')) {
    state.aura = 0; state.clickLvl = 1; state.auraLvl = 0; state.stage = 0; state.boosterLvl = 0; state.boosterEnd = 0;
    state.pets = []; state.active = [];
    document.getElementById('charEmoji').textContent = CFG.emoji[0];
    document.getElementById('stageName').textContent = CFG.names[0];
    toast('Престиж выполнен!');
    updateUI(); save();
  }
}

function doClick(e) {
  state.aura += getClickPower();
  updateUI();
}

function useCode() {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  document.getElementById('codeInput').value = '';
  if (code === 'MAXSCORE559') { state.aura += 1000000; toast('+1 000 000 капелек'); }
  else if (code === 'GEMSMAX') { state.crystals += 100; toast('+100 кристаллов'); }
  else if (code === 'CASES') { state.cases += 5; toast('+5 кейсов'); }
  else toast('Неверный код');
  updateUI(); save();
}

// --- МАГАЗИН И ДОНАТ ---
function openCase() {
  if (state.cases <= 0) return toast('Нет кейсов!');
  state.cases--;
  const rand = Math.random();
  let reward = "";
  if (rand < 0.5) { state.aura += 50000; reward = "50 000 капелек"; }
  else if (rand < 0.8) { state.crystals += 50; reward = "50 кристаллов"; }
  else { 
    // Выдаем случайного эксклюзивного питомца (индексы 15, 16, 17)
    const luckyPet = [15, 16, 17][Math.floor(Math.random() * 3)];
    if (!state.pets.includes(luckyPet)) {
      state.pets.push(luckyPet);
      reward = "Эксклюзивный питомец: " + PETS[luckyPet].name + "!";
    } else {
      state.crystals += 100; reward = "100 кристаллов (питомец уже есть)";
    }
  }
  toast('📦 Открыто: ' + reward);
  updateUI(); save();
  switchTab('shop', document.querySelectorAll('.tab')[3]);
}

function simulateDonate(tier) {
  // Имитация покупки (в реальности тут была бы интеграция с платежной системой)
  if (tier === 15) { state.crystals += 500; toast('Получено 500 кристаллов!'); }
  if (tier === 30) { state.crystals += 1500; state.aura += 100000; state.cases += 1; toast('Получено: 1500 кристаллов, 100к капелек, 1 кейс!'); }
  if (tier === 50) { state.crystals += 3000; state.aura += 500000; state.cases += 3; toast('Получено: 3000 кристаллов, 500к капелек, 3 кейса!'); }
  if (tier === 100) { state.crystals += 10000; state.aura += 5000000; state.cases += 10; toast('Получено: 10000 кристаллов, 5млн капелек, 10 кейсов!'); }
  if (tier === 1000) { 
    state.crystals += 100000; state.aura += 100000000; state.cases += 25; 
    // Выдаем всех 3х эксклюзивных питомцев
    [15, 16, 17].forEach(id => { if (!state.pets.includes(id)) state.pets.push(id); });
    toast('МЕГА-ПАК! Получены все эксклюзивные питомцы и куча ресурсов!'); 
  }
  updateUI(); save();
  switchTab('shop', document.querySelectorAll('.tab')[3]);
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  let html = '';
  
  if (tab === 'pets') {
    PETS.forEach((p, i) => {
      const owned = state.pets.includes(i);
      const active = state.active.includes(i);
      // Не показываем эксклюзивных питомцев в обычном магазине, если их нет
      if (i >= 15 && !owned) return; 

      html += `<div class="pet-card ${active?'on':''}">
        <div style="font-size:20px">${p.emoji}</div>
        <div style="flex:1"><div style="font-weight:bold; font-size:13px;">${p.name}</div><div style="font-size:10px; color:#8a9bbd">Бонус: x${p.val}</div></div>
        ${owned ? `<button class="pet-btn" onclick="togglePet(${i})">${active?'Снять':'Надеть'}</button>` : `<button class="pet-btn" style="background:#6a4cff; color:#fff" onclick="buyPet(${i})">${short(p.cost)}</button>`}
      </div>`;
    });
  } 
  else if (tab === 'talents') {
    html = `
      <div class="pet-card"><div style="flex:1; font-size:13px;">Тяжелая рука (${state.talents.c}/5)</div><button class="pet-btn" style="background:#6a4cff" onclick="buyTalent('c')">${short(1000 * Math.pow(1.5, state.talents.c))} 💧/с</button></div>
      <div class="pet-card"><div style="flex:1; font-size:13px;">Золотая жила (${state.talents.i}/3)</div><button class="pet-btn" style="background:#6a4cff" onclick="buyTalent('i')">${short(1000 * Math.pow(1.5, state.talents.i))} 💧/с</button></div>
    `;
  } 
  else if (tab === 'shop') {
    html = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
         <div style="font-size:13px; font-weight:bold;">Ваши кейсы: ${state.cases} 📦</div>
         <button class="pet-btn" style="background:#5eead4; color:#000;" onclick="openCase()">Открыть</button>
      </div>
      <div class="donate-card">
        <h3>15 рублей</h3>
        <p>500 кристаллов для сокрушительного старта.</p>
        <button class="donate-btn" onclick="simulateDonate(15)">Купить</button>
      </div>
      <div class="donate-card">
        <h3>30 рублей</h3>
        <p>1500 кристаллов + 100 000 капелек + 1 кейс.</p>
        <button class="donate-btn" onclick="simulateDonate(30)">Купить</button>
      </div>
      <div class="donate-card">
        <h3>50 рублей</h3>
        <p>3000 кристаллов + 500 000 капелек + 3 кейса.</p>
        <button class="donate-btn" onclick="simulateDonate(50)">Купить</button>
      </div>
      <div class="donate-card">
        <h3>100 рублей</h3>
        <p>10 000 кристаллов + 5 000 000 капелек + 10 кейсов.</p>
        <button class="donate-btn" onclick="simulateDonate(100)">Купить</button>
      </div>
      <div class="donate-card" style="border-color: #ef4444; background: rgba(239, 68, 68, 0.1);">
        <h3 style="color:#ef4444;">1000 рублей (МЕГА-ПАК)</h3>
        <p>100 000 кристаллов + 100 000 000 капелек + 25 кейсов + <b>3 эксклюзивных питомца</b> (Квантовый Кот, Алмазный Ёж, Кибер-Кит)!</p>
        <button class="donate-btn" style="background:#ef4444; color:#fff;" onclick="simulateDonate(1000)">Купить</button>
      </div>
      <div style="font-size:10px; color:#666; text-align:center; margin-top:5px;">
        *Это демо-версия магазина. В реальной игре здесь будет оплата.
      </div>
    `;
  } 
  else {
    html = `<div style="text-align:center; padding:20px; font-size:13px; color:#8a9bbd;">Тут пока пусто</div>`;
  }
  document.getElementById('tabContent').innerHTML = html;
}

function buyPet(i) { 
  const p = PETS[i]; 
  if (state.aura >= p.cost) { 
    state.aura -= p.cost; 
    state.pets.push(i); 
    updateUI(); save(); 
    switchTab('pets', document.querySelectorAll('.tab')[1]); 
  } 
}
function togglePet(i) { 
  if (state.active.includes(i)) state.active = state.active.filter(x => x !== i); 
  else { 
    if (state.active.length >= 5) return toast('Максимум 5 питомцев в команде'); 
    state.active.push(i); 
  } 
  save(); switchTab('pets', document.querySelectorAll('.tab')[1]); 
}
function buyTalent(type) { 
  const lvl = state.talents[type]; 
  const max = type === 'i' ? 3 : 5; 
  if (lvl >= max) return; 
  const cost = Math.floor(1000 * Math.pow(1.5, lvl)); 
  // Таланты покупаются за пассивный доход (Ауру/сек), как ты и писал в патче!
  if (getIncome() >= cost) { 
    state.talents[type]++; 
    updateUI(); save(); 
    switchTab('talents', document.querySelectorAll('.tab')[2]); 
  } else {
    toast('Недостаточно пассивного дохода!');
  }
}

// ЗАПУСК
load();
checkStage();
updateUI();
setInterval(() => { if (state.auraLvl > 0) { state.aura += getIncome(); updateUI(); } }, 1000);
setInterval(save, 5000);
</script>
